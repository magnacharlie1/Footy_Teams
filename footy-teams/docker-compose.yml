version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: footy
      POSTGRES_PASSWORD: footy
      POSTGRES_DB: footy
    ports:
      - "5432:5432"
    volumes:
      - footy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  footy-db-data:
